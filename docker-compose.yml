services:

  eureka:
    image: mrahul2001/fitness-recommendation-app-eureka:latest
    container_name: eureka
    ports:
      - "8080:8080"

  users-service:
    image: mrahul2001/fitness-recommendation-app-users-service:latest
    container_name: users-service
    ports:
      - "4001:4001"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8080/eureka
    depends_on:
      - eureka

  activities-service:
    image: mrahul2001/fitness-recommendation-app-activities-service:v6
    container_name: activities-service
    ports:
      - "4002:4002"
    environment:
      SPRING_DATA_MONGODB_URI: ${ACTIVITIES_MONGO_URI}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8080/eureka
    depends_on:
      - eureka

  recommendation-service:
    image: mrahul2001/fitness-recommendation-app-recommendation-service:v5
    container_name: recommendation-service
    ports:
      - "4004:4004"
    environment:
      SPRING_DATA_MONGODB_URI: ${RECOMMENDATION_MONGO_URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8080/eureka
    depends_on:
      - eureka

  gateway:
    image: mrahul2001/fitness-recommendation-app-gateway:latest
    container_name: gateway
    ports:
      - "4003:4003"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8080/eureka
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - eureka
      - users-service
      - activities-service
      - recommendation-service
